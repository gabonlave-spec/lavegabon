<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0FA968"/>
      <stop offset="0.55" stop-color="#04704A"/>
      <stop offset="1" stop-color="#0A4FA8"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#8FE3FF"/>
      <stop offset="0.5" stop-color="#2AA6F0"/>
      <stop offset="1" stop-color="#0A5FC0"/>
    </linearGradient>
    <radialGradient id="light" cx="0.75" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00200f" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#light)"/>

  <!-- bulles décor -->
  <g fill="#fff" fill-opacity="0.12" stroke="#fff" stroke-opacity="0.35" stroke-width="3">
    <circle cx="640" cy="120" r="46"/>
    <circle cx="700" cy="520" r="30"/>
    <circle cx="1120" cy="110" r="38"/>
    <circle cx="1080" cy="470" r="56"/>
    <circle cx="560" cy="350" r="16"/>
    <circle cx="1150" cy="300" r="20"/>
  </g>

  <!-- texte -->
  <text x="70" y="120" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" letter-spacing="6" fill="#FFD23F">LAV · LIBREVILLE · GABON</text>
  <text x="66" y="250" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="124" fill="#fff">Lavegabon</text>
  <rect x="70" y="278" width="150" height="10" rx="5" fill="#FFD23F"/>
  <text x="70" y="360" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="48" fill="#fff">Du propre, chez vous.</text>
  <text x="70" y="425" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#E6FFF3">Linge · Lessive · Vaisselle · Lingerie</text>
  <text x="70" y="468" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#E6FFF3">Un laveur près de chez vous, à domicile.</text>

  <!-- pastille -->
  <rect x="70" y="510" width="300" height="60" rx="30" fill="#FFD23F"/>
  <text x="220" y="550" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26" fill="#03402A">Réservez en 1 minute</text>

  <!-- goutte + pin -->
  <g transform="translate(800,50) scale(1.4)">
    <path filter="url(#sh)" fill="url(#drop)" d="M128 10 C128 10 20 135 20 215 A108 108 0 0 0 236 215 C236 135 128 10 128 10 Z"/>
    <path fill="#fff" fill-opacity="0.38" d="M62 195 C62 160 86 124 106 95 C92 132 86 160 88 194 C90 222 100 244 118 260 C84 252 62 228 62 195 Z"/>
    <path fill="#fff" d="M128 275 C128 275 84 230 84 202 A44 44 0 0 1 172 202 C172 230 128 275 128 275 Z"/>
    <circle cx="128" cy="202" r="16" fill="#0A5FC0"/>
  </g>

  <!-- studio + contact -->
  <text x="1130" y="530" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" letter-spacing="1" fill="#FFD23F">Développé par PC-INFORMATIQUE</text>
  <text x="1130" y="562" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#fff">gabonlave@gmail.com  ·  +241 60 14 19 24</text>

  <!-- bande aux couleurs du Gabon -->
  <rect y="590" width="400" height="40" fill="#009E60"/>
  <rect x="400" y="590" width="400" height="40" fill="#FCD116"/>
  <rect x="800" y="590" width="400" height="40" fill="#3A75C4"/>
</svg>
